<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteWise AI - Civic Education Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>VoteWise AI</h1>
        <p>Your AI-powered civic education assistant</p>
    </header>
    
    <main>
        <!-- Chat Interface Placeholder -->
        <div id="chat-container">
            <div id="chat-box">
                <!-- Messages will appear here -->
                <div class="message system-message">Welcome to VoteWise AI! How can I help you understand your civic duties today?</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask a question about voting, elections, etc...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
