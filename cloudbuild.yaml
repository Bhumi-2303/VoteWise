steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-backend', '-f', 'backend/Dockerfile', '.']

  # 2. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-frontend', '-f', 'frontend/Dockerfile', '.']

  # 3. Ensure GEMINI_API_KEY secret exists in Secret Manager
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'setup-secret'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud secrets describe GEMINI_API_KEY > /dev/null 2>&1; then
          echo "Secret GEMINI_API_KEY does not exist. Creating..."
          echo -n "$_GEMINI_API_KEY" | gcloud secrets create GEMINI_API_KEY --data-file=- --replication-policy="automatic"
        else
          echo "Secret GEMINI_API_KEY already exists."
        fi

  # 4. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-backend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

  # 5. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-frontend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Automatically push images to GCR
images:
  - 'gcr.io/$PROJECT_ID/votewise-backend'
  - 'gcr.io/$PROJECT_ID/votewise-frontend'

substitutions:
  _DEPLOY_REGION: 'us-central1'
  _GEMINI_API_KEY: 'placeholder-key'

options:
  logging: CLOUD_LOGGING_ONLY