steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/votewise-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/votewise-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # 2. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/votewise-backend']
    waitFor: ['build-backend']

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-backend:$SHORT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'
    waitFor: ['push-backend']

  # 4. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/votewise-frontend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/votewise-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'
    waitFor: ['deploy-backend'] # Only build frontend if backend deploy is stable

  # 5. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/votewise-frontend']
    waitFor: ['build-frontend']

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-frontend:$SHORT_SHA'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    waitFor: ['push-frontend']

images:
  - 'gcr.io/$PROJECT_ID/votewise-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/votewise-frontend:$SHORT_SHA'

substitutions:
  _DEPLOY_REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true