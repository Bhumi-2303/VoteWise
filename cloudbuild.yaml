steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-backend', '-f', 'backend/Dockerfile', '.']

  # 2. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-frontend', '-f', 'frontend/Dockerfile', '.']

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-backend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY,PORT=8080'

  # 4. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-frontend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Automatically push images to GCR
images:
  - 'gcr.io/$PROJECT_ID/votewise-backend'
  - 'gcr.io/$PROJECT_ID/votewise-frontend'

substitutions:
  _DEPLOY_REGION: 'us-central1'
  _GEMINI_API_KEY: 'placeholder-key'

options:
  logging: CLOUD_LOGGING