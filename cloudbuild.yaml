steps:
  # Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/votewise-backend:latest',
        '-f',
        'backend/Dockerfile',
        '.'
      ]

  # Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/votewise-backend:latest'
      ]
    waitFor: ['build-backend']

  # Run Backend Tests
  - name: 'python:3.10-slim'
    id: 'run-backend-tests'
    entrypoint: bash
    args:
      - -c
      - pip install fastapi uvicorn pytest httpx --quiet && cd backend && pytest tests/ -v 2>&1 || true
    waitFor: ['push-backend']

  # Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'votewise-backend',
        '--image',
        'gcr.io/$PROJECT_ID/votewise-backend:latest',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        '--update-secrets',
        'GEMINI_API_KEY=GEMINI_API_KEY:latest'
      ]
    waitFor: ['run-backend-tests']

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    dir: 'frontend'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/votewise-frontend:latest',
        '-f',
        'Dockerfile',
        '.'
      ]
    waitFor: ['deploy-backend']

  # Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      [
        'push',
        'gcr.io/$PROJECT_ID/votewise-frontend:latest'
      ]
    waitFor: ['build-frontend']

  # Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'votewise-frontend',
        '--image',
        'gcr.io/$PROJECT_ID/votewise-frontend:latest',
        '--region',
        'us-central1',
        '--platform',
        'managed',
        '--allow-unauthenticated'
      ]
    waitFor: ['push-frontend']

options:
  logging: CLOUD_LOGGING_ONLY