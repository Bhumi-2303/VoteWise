steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-backend', '-f', 'backend/Dockerfile', '.']

  # 2. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/votewise-frontend', '-f', 'frontend/Dockerfile', '.']

  # 3. Deploy Backend to Cloud Run
  # We use --update-secrets. If the secret doesn't exist, this step will fail with a clear error.
  # We've removed the automated secret creation as it often fails due to service account permissions.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-backend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'

  # 4. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'votewise-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/votewise-frontend'
      - '--region'
      - '$_DEPLOY_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

# Automatically push images to GCR
images:
  - 'gcr.io/$PROJECT_ID/votewise-backend'
  - 'gcr.io/$PROJECT_ID/votewise-frontend'

substitutions:
  _DEPLOY_REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY